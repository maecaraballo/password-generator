<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Contraseñas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
        }

        .password-display {
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 20px;
            margin: 30px 0;
            font-family: 'Courier New', monospace;
            font-size: 1.2em;
            word-break: break-all;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #495057;
        }

        .controls {
            margin: 30px 0;
        }

        .length-control {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #495057;
            font-weight: 500;
        }

        input[type="range"] {
            width: 100%;
            margin-bottom: 10px;
        }

        .length-value {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1em;
        }

        .generate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin: 10px;
        }

        .generate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .copy-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 0.9em;
            cursor: pointer;
            transition: all 0.2s;
            margin: 10px;
        }

        .copy-btn:hover {
            background: #218838;
            transform: translateY(-1px);
        }

        .copy-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
        }

        .footer {
            margin-top: 30px;
            color: #6c757d;
            font-size: 0.9em;
        }

        .footer a {
            color: #667eea;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔐 Generador de Contraseñas</h1>
        
        <div class="password-display" id="passwordDisplay">
            Haz clic en "Generar" para crear una contraseña segura
        </div>
        
        <div class="controls">
            <div class="length-control">
                <label for="lengthSlider">Longitud de la contraseña: <span class="length-value" id="lengthValue">15</span></label>
                <input type="range" id="lengthSlider" min="8" max="32" value="15">
            </div>
        </div>
        
        <button class="generate-btn" onclick="generatePassword()">🎲 Generar Contraseña</button>
        <button class="copy-btn" id="copyBtn" onclick="copyPassword()" disabled>📋 Copiar</button>
        
        <div class="footer">
            <p>Creado con ❤️ usando <a href="https://aws.amazon.com/q/" target="_blank">Amazon Q</a></p>
        </div>
    </div>

    <script>
        let currentPassword = '';

        // Actualizar el valor mostrado del slider
        document.getElementById('lengthSlider').addEventListener('input', function() {
            document.getElementById('lengthValue').textContent = this.value;
        });

        function generatePassword() {
            const length = parseInt(document.getElementById('lengthSlider').value);
            
            // Caracteres disponibles (equivalente al código Python)
            const lowercase = 'abcdefghijklmnopqrstuvwxyz';
            const uppercase = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const numbers = '0123456789';
            const universe = lowercase + uppercase + numbers;
            
            let password = '';
            for (let i = 0; i < length; i++) {
                const randomIndex = Math.floor(Math.random() * universe.length);
                password += universe[randomIndex];
            }
            
            currentPassword = password;
            document.getElementById('passwordDisplay').textContent = password;
            document.getElementById('copyBtn').disabled = false;
        }

        function copyPassword() {
            if (currentPassword) {
                navigator.clipboard.writeText(currentPassword).then(() => {
                    const copyBtn = document.getElementById('copyBtn');
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = '✅ Copiado!';
                    copyBtn.style.background = '#28a745';
                    
                    setTimeout(() => {
                        copyBtn.textContent = originalText;
                        copyBtn.style.background = '#28a745';
                    }, 2000);
                }).catch(() => {
                    alert('Error al copiar la contraseña');
                });
            }
        }

        // Generar una contraseña inicial
        generatePassword();
    </script>
</body>
</html>
